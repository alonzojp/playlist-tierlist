<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist Tier List</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --bg: #111;
            --surface: #1a1a1a;
            --surface2: #222;
            --border: #2d2d2d;
            --text: #f0f0f0;
            --text-muted: #777;
            --accent: #7c5cbf;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .app { max-width: 1200px; margin: 0 auto; }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            flex-shrink: 0;
        }

        .input-wrap {
            flex: 1;
            min-width: 180px;
            position: relative;
            display: flex;
        }

        input[type="text"] {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 9px 34px 9px 14px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }

        input[type="text"]:focus { border-color: #555; }
        input[type="text"]::placeholder { color: var(--text-muted); }

        .clear-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            line-height: 1;
            display: none;
        }

        .clear-btn.visible { display: block; }
        .clear-btn:hover { color: var(--text); }

        .btn {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 9px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.15s, border-color 0.15s;
            flex-shrink: 0;
        }

        .btn:hover { background: var(--surface2); border-color: #444; }
        .btn:disabled { opacity: 0.4; cursor: default; }

        .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn.primary:hover { background: #8e6fd0; border-color: #8e6fd0; }

        .status { font-size: 13px; color: var(--text-muted); flex-shrink: 0; }
        .status.error { color: #ff5555; }

        /* ── Export / Tierlist ── */
        #export-area {
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .tier-row {
            display: flex;
            align-items: stretch;
            border-bottom: 1px solid #1e1e1e;
        }

        .tier-row:last-child { border-bottom: none; }

        .tier-label {
            width: 64px;
            min-height: 104px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.02em;
            user-select: none;
            word-break: break-all;
            text-align: center;
            padding: 4px;
        }

        .tier-zone {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 4px;
            padding: 6px;
            min-height: 104px;
            background: #1a1a1a;
        }

        /* ── Cards ── */
        .card {
            width: 96px;
            background: #0d0d0d;
            border-radius: 5px;
            overflow: hidden;
            cursor: grab;
            position: relative;
            border: 2px solid transparent;
            transition: border-color 0.15s, transform 0.1s;
            flex-shrink: 0;
            user-select: none;
        }

        .card:active { cursor: grabbing; }
        .card:hover { border-color: #444; transform: scale(1.04); }
        .card.previewing { border-color: var(--accent); }

        .sortable-ghost { opacity: 0.2; }
        .sortable-drag { opacity: 0.85; cursor: grabbing !important; }

        .card-thumb {
            width: 96px;
            height: 54px;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .card-title {
            font-size: 10px;
            line-height: 1.3;
            padding: 4px 5px 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: #ccc;
        }

        .playing-badge {
            position: absolute;
            top: 3px;
            right: 3px;
            background: rgba(0,0,0,0.8);
            color: var(--accent);
            font-size: 11px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .card.previewing .playing-badge { display: flex; }

        /* ── Pool ── */
        #pool-section {
            display: none;
            margin-top: 16px;
        }

        .pool-header {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }

        #pool {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            background: var(--surface);
            border-radius: 10px;
            padding: 12px;
            min-height: 80px;
            border: 1px solid var(--border);
        }

        /* ── Settings Panel ── */
        .settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 99;
            display: none;
        }

        .settings-overlay.open { display: block; }

        .settings-panel {
            position: fixed;
            top: 0;
            right: -380px;
            width: 340px;
            height: 100vh;
            background: var(--surface);
            border-left: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
            transition: right 0.25s ease;
            z-index: 100;
            scrollbar-width: thin;
        }

        .settings-panel.open { right: 0; }

        .settings-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .settings-top h2 {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
        }

        .settings-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 22px;
            line-height: 1;
            padding: 0 4px;
        }

        .settings-close:hover { color: var(--text); }

        .settings-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }

        .reorder-btns {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .reorder-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 3px;
            padding: 1px 5px;
            cursor: pointer;
            font-size: 10px;
            line-height: 1.4;
        }

        .reorder-btn:hover:not(:disabled) { color: var(--text); border-color: #555; }
        .reorder-btn:disabled { opacity: 0.2; cursor: default; }

        input[type="color"] {
            width: 34px;
            height: 34px;
            padding: 2px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            flex-shrink: 0;
        }

        .tier-name-input {
            flex: 1;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            outline: none;
        }

        .tier-name-input:focus { border-color: #555; }

        .remove-tier-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 6px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .remove-tier-btn:hover { border-color: #ff5555; color: #ff5555; }

        .add-tier-btn {
            width: 100%;
            margin-top: 14px;
            padding: 11px;
            background: none;
            border: 1px dashed var(--border);
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.15s;
        }

        .add-tier-btn:hover { border-color: #555; color: var(--text); background: var(--surface2); }

        /* ── Volume control ── */
        .vol-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .vol-icon {
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            width: 20px;
            text-align: center;
        }

        .vol-icon:hover { color: var(--text); }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 72px;
            height: 3px;
            border-radius: 2px;
            background: var(--border);
            outline: none;
            cursor: pointer;
            border: none;
            padding: 0;
            flex: unset;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--text-muted);
            cursor: pointer;
            transition: background 0.15s;
        }

        input[type="range"]::-webkit-slider-thumb:hover { background: var(--text); }
        input[type="range"]::-moz-range-thumb {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: var(--text-muted);
            border: none;
            cursor: pointer;
        }

        /* ── Video Modal ── */
        .video-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .video-modal-overlay.open { display: flex; }

        .video-modal {
            background: var(--surface);
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
            max-width: 860px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.6);
        }

        .video-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            gap: 12px;
        }

        .video-modal-title {
            font-size: 14px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        .video-modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
            flex-shrink: 0;
            padding: 0 4px;
        }

        .video-modal-close:hover { color: var(--text); }

        .video-modal-embed {
            position: relative;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .video-modal-embed iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ── Hidden YT player ── */
        #yt-container {
            position: fixed;
            left: -9999px;
            top: -9999px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>Playlist Tier List</h1>
            <div class="input-wrap">
                <input type="text" id="playlist-input" placeholder="YouTube playlist URL or ID" oninput="onInputChange()" />
                <button class="clear-btn" id="clear-btn" onclick="clearInput()">✕</button>
            </div>
            <button class="btn primary" id="load-btn" onclick="loadPlaylist()">Load</button>
            <button class="btn" onclick="openSettings()">⚙ Tiers</button>
            <button class="btn" id="export-btn" onclick="exportImage()">Export PNG</button>
            <div class="vol-group">
                <span class="vol-icon" id="vol-icon" onclick="togglePreviewMute()">🔉</span>
                <input type="range" id="vol-slider" min="0" max="100" value="30" oninput="setPreviewVolume(this.value)" />
            </div>
            <span id="status" class="status"></span>
        </div>

        <div id="export-area">
            <div id="tierlist"></div>
        </div>

        <div id="pool-section">
            <div class="pool-header">Unranked</div>
            <div id="pool"></div>
        </div>
    </div>

    <div class="video-modal-overlay" id="video-modal-overlay" onclick="closeVideoModal()">
        <div class="video-modal" onclick="event.stopPropagation()">
            <div class="video-modal-header">
                <span class="video-modal-title" id="video-modal-title"></span>
                <button class="video-modal-close" onclick="closeVideoModal()">×</button>
            </div>
            <div class="video-modal-embed">
                <iframe id="video-modal-iframe"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <div class="settings-overlay" id="settings-overlay" onclick="closeSettings()"></div>

    <div class="settings-panel" id="settings-panel">
        <div class="settings-top">
            <h2>Tier Settings</h2>
            <button class="settings-close" onclick="closeSettings()">×</button>
        </div>
        <div id="settings-list"></div>
        <button class="add-tier-btn" onclick="addTier()">+ Add Tier</button>
    </div>

    <div id="yt-container">
        <div id="yt-player"></div>
    </div>

    <script>
        // ── Constants ──
        const API_KEY = 'AIzaSyDdlDRXvLN7LcXxyTNyv2Eg2zksrlZIElI';

        // ── State ──
        let tiers = [
            { id: 't1', name: 'S', color: '#FF7F7F' },
            { id: 't2', name: 'A', color: '#FFBF7F' },
            { id: 't3', name: 'B', color: '#FFFF7F' },
            { id: 't4', name: 'C', color: '#7FFF7F' },
            { id: 't5', name: 'D', color: '#7FBFFF' },
            { id: 't6', name: 'E', color: '#BF7FFF' },
        ];

        let videos = [];
        let tierIdCounter = 10;
        let previewTimeout = null;
        let ytPlayer = null;
        const sortables = new Map();
        let justDragged = false;

        // ── YouTube IFrame API ──
        (function () {
            const tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(tag);
        })();

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('yt-player', {
                height: '1', width: '1',
                playerVars: { autoplay: 0, controls: 0, rel: 0 },
                events: {}
            });
        }

        // ── Playlist Loading ──
        async function loadPlaylist() {
            const val = document.getElementById('playlist-input').value.trim();
            const id = extractPlaylistId(val);
            if (!id) { setStatus('Invalid playlist URL', true); return; }

            setStatus('Loading...');
            document.getElementById('load-btn').disabled = true;

            try {
                const raw = await fetchAllVideos(id);
                if (!raw.length) throw new Error('No videos found.');

                setStatus(`Fetching durations...`);
                const durations = await fetchDurations(raw.map(v => v.videoId));

                setStatus(`Processing ${raw.length} thumbnails...`);
                videos = await Promise.all(raw.map(async v => ({
                    ...v,
                    duration: durations[v.videoId] || 0,
                    dataUrl: await toDataURL(v.thumbnail)
                })));

                renderPool();
                document.getElementById('pool-section').style.display = 'block';
                setStatus(`${videos.length} videos loaded`);
            } catch (e) {
                setStatus(e.message || 'Failed to load.', true);
            } finally {
                document.getElementById('load-btn').disabled = false;
            }
        }

        function extractPlaylistId(input) {
            const m = input.match(/[?&]list=([A-Za-z0-9_-]+)/);
            if (m) return m[1];
            if (/^[A-Za-z0-9_-]{20,}$/.test(input)) return input;
            return null;
        }

        async function fetchAllVideos(playlistId) {
            const result = [];
            let pageToken = '';
            do {
                const url = new URL('https://www.googleapis.com/youtube/v3/playlistItems');
                url.searchParams.set('part', 'snippet');
                url.searchParams.set('playlistId', playlistId);
                url.searchParams.set('maxResults', '50');
                url.searchParams.set('key', API_KEY);
                if (pageToken) url.searchParams.set('pageToken', pageToken);

                const res = await fetch(url.toString());
                const data = await res.json();
                if (data.error) throw new Error(data.error.message);

                for (const item of (data.items || [])) {
                    const s = item.snippet;
                    if (s.resourceId?.kind !== 'youtube#video') continue;
                    if (s.title === 'Private video' || s.title === 'Deleted video') continue;
                    result.push({
                        videoId: s.resourceId.videoId,
                        title: s.title,
                        thumbnail: s.thumbnails?.medium?.url || s.thumbnails?.default?.url || ''
                    });
                }
                pageToken = data.nextPageToken || '';
            } while (pageToken);
            return result;
        }

        async function fetchDurations(videoIds) {
            const durations = {};
            for (let i = 0; i < videoIds.length; i += 50) {
                const batch = videoIds.slice(i, i + 50);
                const url = new URL('https://www.googleapis.com/youtube/v3/videos');
                url.searchParams.set('part', 'contentDetails');
                url.searchParams.set('id', batch.join(','));
                url.searchParams.set('key', API_KEY);
                const res = await fetch(url.toString());
                const data = await res.json();
                for (const item of (data.items || [])) {
                    durations[item.id] = parseDuration(item.contentDetails.duration);
                }
            }
            return durations;
        }

        function parseDuration(iso) {
            const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
            if (!m) return 0;
            return (parseInt(m[1] || 0) * 3600) + (parseInt(m[2] || 0) * 60) + (parseInt(m[3] || 0));
        }

        function getPreviewStart(duration) {
            if (!duration || duration < 45) return 0;
            const min = Math.max(20, Math.floor(duration * 0.35));
            const max = Math.min(Math.floor(duration * 0.65), duration - 20);
            return min + Math.floor(Math.random() * (max - min));
        }

        // Pre-convert thumbnails to data URLs so html2canvas can capture them
        function toDataURL(url) {
            if (!url) return Promise.resolve('');
            return new Promise(resolve => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    try {
                        const c = document.createElement('canvas');
                        c.width = img.naturalWidth;
                        c.height = img.naturalHeight;
                        c.getContext('2d').drawImage(img, 0, 0);
                        resolve(c.toDataURL('image/jpeg', 0.85));
                    } catch { resolve(url); }
                };
                img.onerror = () => resolve(url);
                img.src = url;
            });
        }

        // ── Card ──
        function createCard(video) {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.videoId = video.videoId;

            const img = document.createElement('img');
            img.className = 'card-thumb';
            img.src = video.dataUrl || video.thumbnail;
            img.alt = '';
            img.draggable = false;

            const title = document.createElement('div');
            title.className = 'card-title';
            title.textContent = video.title;

            const badge = document.createElement('div');
            badge.className = 'playing-badge';
            badge.textContent = '♪';

            card.append(img, title, badge);

            // Hover preview — debounced 450ms, starts at a random middle point
            card.addEventListener('mouseenter', () => {
                clearTimeout(previewTimeout);
                previewTimeout = setTimeout(() => {
                    if (!ytPlayer?.loadVideoById) return;
                    ytPlayer.loadVideoById({ videoId: video.videoId, startSeconds: getPreviewStart(video.duration) });
                    try { ytPlayer.setVolume(getPreviewVolume()); } catch {}
                    card.classList.add('previewing');
                }, 450);
            });

            card.addEventListener('mouseleave', () => {
                clearTimeout(previewTimeout);
                try { ytPlayer?.pauseVideo?.(); } catch {}
                card.classList.remove('previewing');
            });

            // Click to view full video — skipped if the card was just dragged
            card.addEventListener('click', () => {
                if (justDragged) return;
                clearTimeout(previewTimeout);
                try { ytPlayer?.pauseVideo?.(); } catch {}
                card.classList.remove('previewing');
                openVideoModal(video);
            });

            return card;
        }

        // ── Pool ──
        function renderPool() {
            const pool = document.getElementById('pool');
            pool.innerHTML = '';
            videos.forEach(v => pool.appendChild(createCard(v)));
            makeSortable(pool);
        }

        // ── Tierlist ──
        function renderTierlist() {
            const tierlist = document.getElementById('tierlist');
            tierlist.innerHTML = '';
            tiers.forEach(tier => {
                const row = document.createElement('div');
                row.className = 'tier-row';
                row.dataset.tierId = tier.id;

                const label = document.createElement('div');
                label.className = 'tier-label';
                label.style.background = tier.color;
                label.style.color = contrastColor(tier.color);
                label.textContent = tier.name;

                const zone = document.createElement('div');
                zone.className = 'tier-zone';
                zone.dataset.tierId = tier.id;

                row.append(label, zone);
                tierlist.appendChild(row);
                makeSortable(zone);
            });
        }

        function contrastColor(hex) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.55 ? '#111' : '#fff';
        }

        // ── SortableJS ──
        function makeSortable(el) {
            if (sortables.has(el)) sortables.get(el).destroy();
            const s = Sortable.create(el, {
                group: 'tierlist',
                animation: 150,
                ghostClass: 'sortable-ghost',
                dragClass: 'sortable-drag',
                onStart() {
                    clearTimeout(previewTimeout);
                    try { ytPlayer?.pauseVideo?.(); } catch {}
                    document.querySelectorAll('.card.previewing').forEach(c => c.classList.remove('previewing'));
                },
                onEnd() {
                    justDragged = true;
                    setTimeout(() => { justDragged = false; }, 150);
                }
            });
            sortables.set(el, s);
        }

        // ── State save/restore (used when re-rendering tiers) ──
        function saveState() {
            return {
                pool: [...document.querySelectorAll('#pool .card')].map(c => c.dataset.videoId),
                zones: Object.fromEntries(
                    [...document.querySelectorAll('.tier-zone')].map(z => [
                        z.dataset.tierId,
                        [...z.querySelectorAll('.card')].map(c => c.dataset.videoId)
                    ])
                )
            };
        }

        function restoreState(state) {
            const pool = document.getElementById('pool');
            pool.innerHTML = '';

            state.pool.forEach(id => {
                const v = videos.find(v => v.videoId === id);
                if (v) pool.appendChild(createCard(v));
            });

            for (const [tierId, ids] of Object.entries(state.zones)) {
                const zone = document.querySelector(`.tier-zone[data-tier-id="${tierId}"]`);
                ids.forEach(id => {
                    const v = videos.find(v => v.videoId === id);
                    if (!v) return;
                    (zone || pool).appendChild(createCard(v));
                });
            }
        }

        // ── Tier CRUD ──
        function addTier() {
            const state = saveState();
            tiers.push({ id: 't' + (++tierIdCounter), name: 'New', color: '#888888' });
            renderTierlist();
            restoreState(state);
            renderSettings();
        }

        function removeTier(id) {
            const zone = document.querySelector(`.tier-zone[data-tier-id="${id}"]`);
            const pool = document.getElementById('pool');
            if (zone) [...zone.children].forEach(c => pool.appendChild(c));
            tiers = tiers.filter(t => t.id !== id);
            document.querySelector(`.tier-row[data-tier-id="${id}"]`)?.remove();
            renderSettings();
        }

        function moveTier(id, dir) {
            const i = tiers.findIndex(t => t.id === id);
            const j = i + dir;
            if (j < 0 || j >= tiers.length) return;
            const state = saveState();
            [tiers[i], tiers[j]] = [tiers[j], tiers[i]];
            renderTierlist();
            restoreState(state);
            renderSettings();
        }

        function updateColor(id, color) {
            const tier = tiers.find(t => t.id === id);
            if (!tier) return;
            tier.color = color;
            const label = document.querySelector(`.tier-row[data-tier-id="${id}"] .tier-label`);
            if (label) { label.style.background = color; label.style.color = contrastColor(color); }
        }

        function updateName(id, name) {
            const tier = tiers.find(t => t.id === id);
            if (!tier) return;
            tier.name = name;
            const label = document.querySelector(`.tier-row[data-tier-id="${id}"] .tier-label`);
            if (label) label.textContent = name;
        }

        // ── Settings Panel ──
        function renderSettings() {
            const list = document.getElementById('settings-list');
            list.innerHTML = '';
            tiers.forEach((tier, i) => {
                const item = document.createElement('div');
                item.className = 'settings-item';
                item.innerHTML = `
                    <div class="reorder-btns">
                        <button class="reorder-btn" onclick="moveTier('${tier.id}',-1)" ${i === 0 ? 'disabled' : ''}>▲</button>
                        <button class="reorder-btn" onclick="moveTier('${tier.id}',1)" ${i === tiers.length - 1 ? 'disabled' : ''}>▼</button>
                    </div>
                    <input type="color" value="${tier.color}" onchange="updateColor('${tier.id}',this.value)" />
                    <input type="text" class="tier-name-input" value="${tier.name}" maxlength="8"
                           oninput="updateName('${tier.id}',this.value)" />
                    <button class="remove-tier-btn" onclick="removeTier('${tier.id}')">×</button>
                `;
                list.appendChild(item);
            });
        }

        function openSettings() {
            renderSettings();
            document.getElementById('settings-panel').classList.add('open');
            document.getElementById('settings-overlay').classList.add('open');
        }

        function closeSettings() {
            document.getElementById('settings-panel').classList.remove('open');
            document.getElementById('settings-overlay').classList.remove('open');
        }

        // ── Export ──
        async function exportImage() {
            const btn = document.getElementById('export-btn');
            btn.textContent = 'Exporting...';
            btn.disabled = true;
            try {
                const canvas = await html2canvas(document.getElementById('export-area'), {
                    scale: 2,
                    backgroundColor: '#111111',
                    useCORS: true,
                    logging: false
                });
                const a = document.createElement('a');
                a.download = 'tierlist.png';
                a.href = canvas.toDataURL('image/png');
                a.click();
            } catch {
                setStatus('Export failed', true);
            } finally {
                btn.textContent = 'Export PNG';
                btn.disabled = false;
            }
        }

        // ── Video Modal ──
        function openVideoModal(video) {
            document.getElementById('video-modal-title').textContent = video.title;
            document.getElementById('video-modal-iframe').src =
                `https://www.youtube.com/embed/${video.videoId}?autoplay=1&rel=0`;
            document.getElementById('video-modal-overlay').classList.add('open');
        }

        function closeVideoModal() {
            document.getElementById('video-modal-overlay').classList.remove('open');
            document.getElementById('video-modal-iframe').src = '';
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeVideoModal();
        });

        // ── Preview volume ──
        function getPreviewVolume() {
            return parseInt(document.getElementById('vol-slider').value);
        }

        function setPreviewVolume(val) {
            const v = parseInt(val);
            try { if (ytPlayer?.setVolume) ytPlayer.setVolume(v); } catch {}
            const icon = document.getElementById('vol-icon');
            icon.textContent = v === 0 ? '🔇' : v < 50 ? '🔉' : '🔊';
        }

        function togglePreviewMute() {
            const slider = document.getElementById('vol-slider');
            if (parseInt(slider.value) === 0) {
                const prev = parseInt(slider.dataset.prev || '30');
                slider.value = prev;
                setPreviewVolume(prev);
            } else {
                slider.dataset.prev = slider.value;
                slider.value = 0;
                setPreviewVolume(0);
            }
        }

        // ── Input helpers ──
        function onInputChange() {
            const val = document.getElementById('playlist-input').value;
            document.getElementById('clear-btn').classList.toggle('visible', val.length > 0);
        }

        function clearInput() {
            document.getElementById('playlist-input').value = '';
            document.getElementById('clear-btn').classList.remove('visible');
            document.getElementById('playlist-input').focus();
        }

        function setStatus(msg, isError = false) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status' + (isError ? ' error' : '');
        }

        // ── Init ──
        renderTierlist();

        document.getElementById('playlist-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') loadPlaylist();
        });
    </script>
</body>
</html>
